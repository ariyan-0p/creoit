# nginx site for CREOIT — public front door in front of the Next.js app.
# `server_name _` + default_server answers on the bare IP until the domain is
# connected; certbot rewrites this file to add HTTPS once DNS points here.

upstream creoit_app {
    server 127.0.0.1:3000;
    keepalive 16;
}

# Compress text assets (JS/CSS/SVG/JSON/HTML) — big win on slow connections.
# (`gzip on;` is already set in the stock /etc/nginx/nginx.conf.)
gzip_comp_level 5;
gzip_min_length 512;
gzip_vary on;
gzip_proxied any;
gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss image/svg+xml font/ttf;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    client_max_body_size 2m;

    # Fingerprinted build files never change: cache them for a year.
    location /_next/static/ {
        proxy_pass http://creoit_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Fonts, images, icons: a long cache, revalidated daily.
    location ~* \.(?:woff2?|ttf|otf|png|jpe?g|webp|avif|svg|ico|mp4|webm)$ {
        proxy_pass http://creoit_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800";
    }

    location / {
        proxy_pass http://creoit_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
